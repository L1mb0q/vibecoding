<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e27;
    --bg-2: #151935;
    --bg-3: #1e2347;
    --accent: #00d9a3;
    --accent-2: #00b88a;
    --text: #e6e8f2;
    --text-dim: #8a90b5;
    --border: #2a2f55;
    --code-bg: #0d1117;
    --danger: #ff6b6b;
    --warning: #ffd93d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }
  header {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #000;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 14px;
  }
  .stat-badge {
    background: var(--bg-3);
    padding: 6px 14px;
    border-radius: 20px;
    color: var(--accent);
    font-weight: 600;
  }
  .container {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 63px);
  }
  aside {
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
    max-height: calc(100vh - 63px);
    position: sticky;
    top: 63px;
  }
  .sidebar-title {
    padding: 0 20px 12px;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .lesson-list {
    list-style: none;
  }
  .lesson-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  .lesson-item:hover {
    background: var(--bg-3);
  }
  .lesson-item.active {
    background: var(--bg-3);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--accent);
    font-weight: bold;
    margin-right: 4px;
  }
  .lesson-item.locked {
    color: var(--text-dim);
    opacity: 0.5;
  }
  .lesson-num {
    background: var(--bg);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .lesson-item.completed .lesson-num {
    background: var(--accent);
    color: #000;
  }
  main {
    padding: 40px 50px;
    max-width: 1100px;
  }
  .lesson-header {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-tag {
    display: inline-block;
    background: var(--bg-3);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .lesson-title {
    font-size: 32px;
    margin-bottom: 10px;
    color: var(--text);
  }
  .lesson-desc {
    color: var(--text-dim);
    font-size: 16px;
  }
  .content {
    font-size: 16px;
  }
  .content h2 {
    font-size: 22px;
    margin: 28px 0 14px;
    color: var(--accent);
  }
  .content h3 {
    font-size: 18px;
    margin: 20px 0 10px;
  }
  .content p {
    margin-bottom: 14px;
    color: var(--text);
  }
  .content ul, .content ol {
    margin: 10px 0 14px 24px;
  }
  .content li {
    margin-bottom: 6px;
  }
  .content code:not(pre code) {
    background: var(--bg-3);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
  }
  .info-box {
    background: rgba(0, 217, 163, 0.08);
    border-left: 4px solid var(--accent);
    padding: 14px 18px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .warning-box {
    background: rgba(255, 217, 61, 0.08);
    border-left: 4px solid var(--warning);
    padding: 14px 18px;
    margin: 16px 0;
    border-radius: 4px;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    margin: 14px 0;
    position: relative;
  }
  pre code {
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 14px;
    color: #e6e8f2;
    line-height: 1.5;
  }
  .editor-wrapper {
    margin: 20px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .editor-header {
    background: var(--bg-3);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .editor-title {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .editor-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--accent-2);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--bg-3);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: var(--border);
  }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .editor-textarea {
    width: 100%;
    min-height: 180px;
    background: var(--code-bg);
    color: var(--text);
    border: none;
    padding: 14px 18px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .output-panel {
    background: #000;
    border-top: 1px solid var(--border);
    padding: 12px 18px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    min-height: 60px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: #ccc;
  }
  .output-panel .error { color: var(--danger); }
  .output-panel .success { color: var(--accent); }
  .output-panel .info { color: var(--text-dim); }
  .task-box {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin: 24px 0;
  }
  .task-title {
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 16px;
  }
  .task-desc {
    margin-bottom: 14px;
  }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
    margin: 10px 20px 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #0099cc);
    transition: width 0.4s;
  }
  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 39, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 16px;
  }
  .loading-overlay.hidden { display: none; }
  .big-spinner {
    width: 50px; height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .welcome-hero {
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, rgba(0, 217, 163, 0.08), rgba(0, 153, 204, 0.08));
    border-radius: 12px;
    margin-bottom: 30px;
  }
  .welcome-hero h1 {
    font-size: 42px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome-hero p {
    font-size: 18px;
    color: var(--text-dim);
    max-width: 600px;
    margin: 0 auto 24px;
  }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 30px;
  }
  .feature-card {
    background: var(--bg-2);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .feature-card h4 {
    color: var(--accent);
    margin-bottom: 8px;
  }
  .feature-card p {
    color: var(--text-dim);
    font-size: 14px;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    aside {
      position: relative;
      top: 0;
      max-height: none;
    }
    main { padding: 20px; }
    .lesson-title { font-size: 24px; }
    .welcome-hero h1 { font-size: 28px; }
    .header-stats { display: none; }
  }
  aside::-webkit-scrollbar, .output-panel::-webkit-scrollbar {
    width: 8px;
  }
  aside::-webkit-scrollbar-track, .output-panel::-webkit-scrollbar-track {
    background: var(--bg-2);
  }
  aside::-webkit-scrollbar-thumb, .output-panel::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="big-spinner"></div>
  <div style="color: var(--accent); font-size: 18px; font-weight: 600;">Загрузка Python-интерпретатора...</div>
  <div style="color: var(--text-dim); font-size: 14px;" id="loadStatus">Инициализация Pyodide</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <span>PyCamp</span>
  </div>
  <div class="header-stats">
    <div class="stat-badge" id="progressBadge">0 / 15 уроков</div>
    <button class="btn btn-secondary" onclick="resetProgress()">Сброс</button>
  </div>
</header>

<div class="container">
  <aside>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="sidebar-title">Программа курса</div>
    <ul class="lesson-list" id="lessonList"></ul>
  </aside>
  <main id="mainContent"></main>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const lessons = [
  {
    id: 0,
    title: "Добро пожаловать",
    tag: "Введение",
    desc: "Знакомство с курсом и установка окружения",
    content: `
      <div class="welcome-hero">
        <h1>Полный курс Python</h1>
        <p>Изучите Python с нуля до продвинутого уровня. Интерактивные уроки, практические задания и реальный Python прямо в браузере.</p>
      </div>
      <h2>Что вас ждёт</h2>
      <div class="features-grid">
        <div class="feature-card"><h4>📚 15 уроков</h4><p>От основ до ООП и продвинутых тем</p></div>
        <div class="feature-card"><h4>💻 Интерактивность</h4><p>Пишите и запускайте код прямо в браузере</p></div>
        <div class="feature-card"><h4>🎯 Практика</h4><p>Задания после каждого урока</p></div>
        <div class="feature-card"><h4>📊 Прогресс</h4><p>Автоматическое сохранение достижений</p></div>
      </div>
      <h2>О Python</h2>
      <p>Python — высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своим чистым синтаксисом и читаемостью, что делает его идеальным для начинающих.</p>
      <div class="info-box">💡 <strong>Совет:</strong> Нажимайте кнопку "Запустить" в редакторах кода, чтобы увидеть результат выполнения Python-кода прямо здесь.</div>
      <h2>Где используется Python?</h2>
      <ul>
        <li><strong>Веб-разработка:</strong> Django, Flask, FastAPI</li>
        <li><strong>Data Science:</strong> NumPy, Pandas, Matplotlib</li>
        <li><strong>Machine Learning:</strong> TensorFlow, PyTorch, scikit-learn</li>
        <li><strong>Автоматизация:</strong> скрипты, боты, парсеры</li>
        <li><strong>Игры:</strong> Pygame</li>
      </ul>
      <p>Готовы начать? Переходите к первому уроку!</p>
    `,
    code: `# Добро пожаловать в PyCamp!
# Это ваш первый Python-код
print("Hello, PyCamp!")
print("Я начинаю изучать Python 🐍")`,
    task: null
  },
  {
    id: 1,
    title: "Первые шаги",
    tag: "Урок 1",
    desc: "Функция print(), комментарии и первый код",
    content: `
      <h2>Функция print()</h2>
      <p>Функция <code>print()</code> выводит текст на экран. Это первая функция, с которой знакомятся все программисты.</p>
      <pre><code>print("Привет, мир!")
print("Меня зовут Python")</code></pre>
      <h2>Кавычки</h2>
      <p>Строки можно заключать в одинарные или двойные кавычки — оба варианта равноправны:</p>
      <pre><code>print('Одинарные кавычки')
print("Двойные кавычки")</code></pre>
      <h2>Комментарии</h2>
      <p>Комментарии начинаются с символа <code>#</code> и игнорируются интерпретатором. Они помогают объяснить код.</p>
      <pre><code># Это комментарий
print("Этот код выполнится")
# print("А этот — нет")</code></pre>
      <h2>Несколько значений</h2>
      <p>В <code>print()</code> можно передать несколько значений через запятую:</p>
      <pre><code>print("Меня зовут", "Python", 3)
print("Результат:", 2 + 2)</code></pre>
    `,
    code: `# Напишите программу, которая выводит:
# "Привет, PyCamp!"
# "Я учу Python"
print("Привет, PyCamp!")
print("Я учу Python")`,
    task: {
      desc: 'Измените код так, чтобы он вывел две строки: "Привет, PyCamp!" и "Я учу Python"',
      check: (output) => output.includes("Привет, PyCamp!") && output.includes("Я учу Python")
    }
  },
  {
    id: 2,
    title: "Переменные и типы данных",
    tag: "Урок 2",
    desc: "int, float, str, bool и присваивание",
    content: `
      <h2>Что такое переменная?</h2>
      <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
      <h2>Основные типы данных</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Привет"</code>, <code>'Python'</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — специальное значение <code>None</code></li>
      </ul>
      <h2>Функция type()</h2>
      <p>Чтобы узнать тип переменной, используйте <code>type()</code>:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
      <h2>Правила именования</h2>
      <ul>
        <li>Имя может содержать буквы, цифры и знак подчёркивания</li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>name</code> и <code>Name</code> — разные переменные</li>
        <li>Нельзя использовать ключевые слова: <code>if</code>, <code>for</code>, <code>class</code> и т.д.</li>
      </ul>
      <div class="info-box">💡 В Python принято использовать <strong>snake_case</strong> для имён переменных: <code>user_name</code>, а не <code>userName</code>.</div>
    `,
    code: `# Создайте переменные и выведите их типы
name = "Python"
version = 3.12
is_cool = True
year = 1991

print(name, type(name))
print(version, type(version))
print(is_cool, type(is_cool))
print(year, type(year))`,
    task: {
      desc: 'Создайте переменную <code>language</code> со значением "Python" и переменную <code>age</code> со значением 33. Выведите их через пробел.',
      check: (output) => output.includes("Python") && output.includes("33")
    }
  },
  {
    id: 3,
    title: "Операторы",
    tag: "Урок 3",
    desc: "Арифметические, сравнения, логические операторы",
    content: `
      <h2>Арифметические операторы</h2>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
      <h2>Операторы сравнения</h2>
      <pre><code>x = 5
print(x == 5)   # True  — равно
print(x != 5)   # False — не равно
print(x > 3)    # True  — больше
print(x < 3)    # False — меньше
print(x >= 5)   # True  — больше или равно
print(x <= 4)   # False — меньше или равно</code></pre>
      <h2>Логические операторы</h2>
      <pre><code>a = True
b = False

print(a and b)  # False
print(a or b)   # True
print(not a)    # False</code></pre>
      <h2>Операторы присваивания</h2>
      <pre><code>x = 10
x += 5   # x = x + 5  → 15
x -= 3   # x = x - 3  → 12
x *= 2   # x = x * 2  → 24
x /= 4   # x = x / 4  → 6.0</code></pre>
      <div class="warning-box">⚠️ Оператор <code>=</code> — это присваивание, а <code>==</code> — сравнение. Не путайте их!</div>
    `,
    code: `# Вычислите и выведите результаты
a = 17
b = 5

print("Сумма:", a + b)
print("Разность:", a - b)
print("Произведение:", a * b)
print("Частное:", a / b)
print("Остаток:", a % b)`,
    task: {
      desc: 'Вычислите и выведите остаток от деления 17 на 5 (должно быть 2).',
      check: (output) => output.includes("2")
    }
  },
  {
    id: 4,
    title: "Строки",
    tag: "Урок 4",
    desc: "Работа со строками, срезы, методы",
    content: `
      <h2>Создание строк</h2>
      <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""
s4 = "Он сказал: \\"Привет\\""</code></pre>
      <h2>Конкатенация и повторение</h2>
      <pre><code>a = "Hello"
b = "World"

      <h2>Декораторы</h2>
      <p>Функции, которые модифицируют поведение других функций:</p>
      <pre><code>import time

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        print(f"{func.__name__} выполнилась за {time.time() - start:.4f}с")
        return result
    return wrapper

@timer
def slow_function():
    import time
    time.sleep(0.1)
    return 42

slow_function()</code></pre>

with Timer():

def fibonacci(n):
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b

# Декоратор
def repeat(n):
    def decorator(func):
        def wrapper(*args, **kwargs):
            for _ in range(n):

// ============ СОСТОЯНИЕ ============
let currentLesson = 0;
let completedLessons = new Set();
let pyodide = null;

// Загрузка прогресса
try {
  const saved = JSON.parse(localStorage.getItem('pycamp_progress') || '[]');
  completedLessons = new Set(saved);
  currentLesson = parseInt(localStorage.getItem('pycamp_current') || '0');
} catch(e) {}

// ============ PYODIDE ============
async function loadPyodideRuntime() {
  const status = document.getElementById('loadStatus');
  try {
    status.textContent = "Загрузка скрипта Pyodide...";
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
    status.textContent = "Инициализация Python...";
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
    });
    status.textContent = "Готово!";
    setTimeout(() => {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }, 400);
  } catch(e) {
    status.innerHTML = `<span style="color: var(--danger)">Ошибка загрузки: ${e.message}<br>Проверьте интернет-соединение и обновите страницу.</span>`;
  }
}

async function runPython(code, outputId) {
  const output = document.getElementById(outputId);
  output.innerHTML = '<span class="info"><span class="loader"></span>Выполнение...</span>';
  output.className = 'output-panel';
  
  if (!pyodide) {
    output.innerHTML = '<span class="error">Python ещё не загружен. Подождите...</span>';
    return;
  }
  
  try {
    // Перехват stdout/stderr
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    
    await pyodide.runPythonAsync(code);
    
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');
    
    // Восстановление
    pyodide.runPython(`
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    
    let result = '';
    if (stdout) result += escapeHtml(stdout);
    if (stderr) result += '<span class="error">' + escapeHtml(stderr) + '</span>';
    if (!result) result = '<span class="info">[код выполнен без вывода]</span>';
    
    output.innerHTML = result;
    
    // Проверка задания
    const lesson = lessons[currentLesson];
    if (lesson.task) {
      const passed = lesson.task.check(stdout + stderr);
      if (passed) {
        output.innerHTML += '\n<span class="success">✓ Задание выполнено!</span>';
        if (!completedLessons.has(currentLesson)) {
          completedLessons.add(currentLesson);
          saveProgress();
          renderSidebar();
          updateProgress();
        }
      } else {
        output.innerHTML += '\n<span class="error">✗ Задание не выполнено. Попробуйте ещё раз.</span>';
      }
    }
  } catch(e) {
    pyodide.runPython(`
try:
    sys.stdout = sys.__stdout__
    sys.stderr = sys.__stderr__
except: pass
`);
    output.innerHTML = '<span class="error">Ошибка: ' + escapeHtml(e.message) + '</span>';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ РЕНДЕРИНГ ============
function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  lessons.forEach((lesson, i) => {
    const li = document.createElement('li');
    li.className = 'lesson-item';
    if (i === currentLesson) li.classList.add('active');
    if (completedLessons.has(i)) li.classList.add('completed');
    li.innerHTML = `<span class="lesson-num">${i}</span><span>${lesson.title}</span>`;
    li.onclick = () => loadLesson(i);
    list.appendChild(li);
  });
}

function updateProgress() {
  const total = lessons.length;
  const done = completedLessons.size;
  document.getElementById('progressBadge').textContent = `${done} / ${total} уроков`;
  document.getElementById('progressFill').style.width = `${(done/total)*100}%`;
}

function saveProgress() {
  localStorage.setItem('pycamp_progress', JSON.stringify([...completedLessons]));
  localStorage.setItem('pycamp_current', currentLesson);
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) {
    completedLessons.clear();
    currentLesson = 0;
    saveProgress();
    renderSidebar();
    updateProgress();
    loadLesson(0);
  }
}

function loadLesson(idx) {
  currentLesson = idx;
  saveProgress();
  renderSidebar();
  
  const lesson = lessons[idx];
  const main = document.getElementById('mainContent');
  const outputId = 'output_' + idx;
  const editorId = 'editor_' + idx;
  
  let taskHtml = '';
  if (lesson.task) {
    taskHtml = `
      <div class="task-box">
        <div class="task-title">🎯 Задание</div>
        <div class="task-desc">${lesson.task.desc}</div>
      </div>
    `;
  }
  
  main.innerHTML = `
    <div class="lesson-header">
      <span class="lesson-tag">${lesson.tag}</span>
      <h1 class="lesson-title">${lesson.title}</h1>
      <p class="lesson-desc">${lesson.desc}</p>
    </div>
    <div class="content">
      ${lesson.content}
    </div>
    <div class="editor-wrapper">
      <div class="editor-header">
        <div class="editor-title">🐍 Python — попробуйте сами</div>
        <div class="editor-actions">
          <button class="btn btn-secondary" onclick="resetCode(${idx})">Сброс</button>
          <button class="btn" onclick="runCode(${idx})">▶ Запустить</button>
        </div>
      </div>
      <textarea class="editor-textarea" id="${editorId}" spellcheck="false">${escapeHtml(lesson.code)}</textarea>
      <div class="output-panel" id="${outputId}"><span class="info">Нажмите "Запустить", чтобы выполнить код</span></div>
    </div>
    ${taskHtml}
    <div class="nav-buttons">
      <button class="btn btn-secondary" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''} onclick="loadLesson(${idx-1})">← Предыдущий</button>
      <button class="btn" ${idx === lessons.length-1 ? 'disabled style="opacity:0.4"' : ''} onclick="loadLesson(${idx+1})">Следующий →</button>
    </div>
  `;
  
  // Поддержка Tab в редакторе
  const editor = document.getElementById(editorId);
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
    }
  });
  
  main.scrollTop = 0;
  window.scrollTo(0, 0);
}

function runCode(idx) {
  const code = document.getElementById('editor_' + idx).value;
  runPython(code, 'output_' + idx);
}

function resetCode(idx) {
  document.getElementById('editor_' + idx).value = lessons[idx].code;
  document.getElementById('output_' + idx).innerHTML = '<span class="info">Код сброшен</span>';
}

// ============ СТАРТ ============
renderSidebar();
updateProgress();
loadLesson(currentLesson);
loadPyodideRuntime();
</script>
